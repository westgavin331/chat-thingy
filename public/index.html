<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>My Chat</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1116;
    --panel: #161b22;
    --border: #262c36;
    --text: #e6e8eb;
    --muted: #8b92a1;
    --accent: #5b8cff;
    --accent-dim: #2f4680;
    --bot-bg: #1e242e;
    --error-bg: #3a1d1d;
    --error-border: #7a3333;
    --error-text: #ffb4b4;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  #header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  #header .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  #header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    color: var(--text);
    letter-spacing: 0.2px;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar {
    width: 8px;
  }
  #chat::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 8px;
  }

  .row {
    display: flex;
    margin-bottom: 8px;
    animation: rise 0.18s ease-out;
  }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 15px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.user {
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    background: var(--bot-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    background: var(--error-bg);
    color: var(--error-text);
    border: 1px solid var(--error-border);
    border-bottom-left-radius: 4px;
  }

  /* Markdown content inside bot bubbles */
  .msg p { margin: 0 0 8px 0; }
  .msg p:last-child { margin-bottom: 0; }
  .msg h1, .msg h2, .msg h3 {
    margin: 4px 0 8px 0;
    line-height: 1.3;
  }
  .msg h1 { font-size: 1.25em; }
  .msg h2 { font-size: 1.15em; }
  .msg h3 { font-size: 1.05em; }
  .msg ul, .msg ol {
    margin: 4px 0 8px 22px;
    padding: 0;
  }
  .msg li { margin-bottom: 3px; }
  .msg strong { font-weight: 700; }
  .msg em { font-style: italic; }
  .msg code {
    background: rgba(255,255,255,0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9em;
  }
  .msg pre {
    background: #0b0e13;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 6px 0;
  }
  .msg pre code {
    background: none;
    padding: 0;
    font-size: 0.85em;
    white-space: pre;
  }
  .msg.user code {
    background: rgba(255,255,255,0.2);
  }

  /* Typing indicator */
  .typing {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  #inputBar {
    display: flex;
    padding: 12px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    gap: 8px;
    flex-shrink: 0;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  #inputBox {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #0f141b;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease;
  }
  #inputBox:focus {
    border-color: var(--accent);
  }
  #inputBox::placeholder {
    color: var(--muted);
  }
  #sendBtn {
    padding: 10px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  #sendBtn:hover:not(:disabled) {
    background: #6f9aff;
  }
  #sendBtn:active:not(:disabled) {
    transform: scale(0.97);
  }
  #sendBtn:disabled {
    background: var(--accent-dim);
    cursor: default;
  }

  @media (max-width: 520px) {
    .msg { max-width: 88%; }
    #chat { padding: 14px; }
    #inputBar { padding: 10px; }
  }
</style>
</head>
<body>

<div id="header">
  <div class="dot"></div>
  <h1>My Chat</h1>
</div>

<div id="chat"></div>

<div id="inputBar">
  <input id="inputBox" type="text" placeholder="Type a message..." autocomplete="off" />
  <button id="sendBtn">Send</button>
</div>

<script>
  const chat = document.getElementById("chat");
  const inputBox = document.getElementById("inputBox");
  const sendBtn = document.getElementById("sendBtn");

  // Simple in-memory conversation history (resets on page refresh).
  // Only the recent turns are kept so the prompt sent to the server
  // doesn't grow without bound.
  const history = [];
  const MAX_HISTORY_TURNS = 12;

  // --- Minimal markdown renderer -------------------------------------
  // Supports: fenced code blocks, inline code, bold, italic, headers,
  // bullet/numbered lists, paragraphs/line breaks. Escapes HTML first
  // so bot output can never inject markup.
  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function renderInline(text) {
    let out = escapeHtml(text);
    out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
    out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
    out = out.replace(/\b_([^_\n]+)_\b/g, "<em>$1</em>");
    return out;
  }

  function markdownToHtml(raw) {
    // Pull out fenced code blocks first so their contents are left alone.
    const blocks = [];
    let text = raw.replace(/```([a-zA-Z0-9]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const idx = blocks.length;
      blocks.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ""))}</code></pre>`);
      return ` BLOCK${idx} `;
    });

    const lines = text.split("\n");
    let html = "";
    let listType = null; // "ul" | "ol" | null
    let paragraph = [];

    function flushParagraph() {
      if (paragraph.length) {
        html += `<p>${paragraph.map(renderInline).join("<br>")}</p>`;
        paragraph = [];
      }
    }
    function closeList() {
      if (listType) {
        html += `</${listType}>`;
        listType = null;
      }
    }

    for (const line of lines) {
      const headerMatch = line.match(/^(#{1,3})\s+(.*)$/);
      const bulletMatch = line.match(/^\s*[-*]\s+(.*)$/);
      const numberedMatch = line.match(/^\s*\d+\.\s+(.*)$/);
      const blockMatch = line.trim().match(/^BLOCK(\d+)$/);

      if (blockMatch) {
        flushParagraph();
        closeList();
        html += ` BLOCK${blockMatch[1]} `;
      } else if (headerMatch) {
        flushParagraph();
        closeList();
        const level = headerMatch[1].length;
        html += `<h${level}>${renderInline(headerMatch[2])}</h${level}>`;
      } else if (bulletMatch) {
        flushParagraph();
        if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; }
        html += `<li>${renderInline(bulletMatch[1])}</li>`;
      } else if (numberedMatch) {
        flushParagraph();
        if (listType !== "ol") { closeList(); html += "<ol>"; listType = "ol"; }
        html += `<li>${renderInline(numberedMatch[1])}</li>`;
      } else if (line.trim() === "") {
        flushParagraph();
        closeList();
      } else {
        closeList();
        paragraph.push(line);
      }
    }
    flushParagraph();
    closeList();

    // Restore code blocks.
    html = html.replace(/ BLOCK(\d+) /g, (_, idx) => blocks[Number(idx)]);
    return html;
  }

  function isNearBottom() {
    return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
  }

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
    // Run again after layout settles (images, multi-line markdown, fonts).
    requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
  }

  function addMessage(text, sender) {
    const wasNearBottom = isNearBottom();
    const row = document.createElement("div");
    row.className = "row " + sender;

    const bubble = document.createElement("div");
    bubble.className = "msg " + sender;

    if (sender === "bot") {
      bubble.innerHTML = markdownToHtml(text);
    } else {
      bubble.textContent = text;
    }

    row.appendChild(bubble);
    chat.appendChild(row);

    if (wasNearBottom || sender === "user") {
      scrollToBottom();
    }
    return row;
  }

  function showTypingIndicator() {
    const row = document.createElement("div");
    row.className = "row bot";
    row.id = "typingRow";
    const bubble = document.createElement("div");
    bubble.className = "msg bot";
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollToBottom();
  }

  function hideTypingIndicator() {
    const row = document.getElementById("typingRow");
    if (row) row.remove();
  }

  // Builds the text actually sent to the server: recent conversation
  // history plus the new message, so the bot has context. The server
  // itself is unchanged and still just receives one "message" string.
  function buildMessageWithHistory(newText) {
    if (history.length === 0) return newText;
    const recent = history.slice(-MAX_HISTORY_TURNS);
    const transcript = recent
      .map((m) => (m.role === "user" ? "User: " : "Assistant: ") + m.text)
      .join("\n");
    return (
      "Continue this conversation naturally, using the context below.\n\n" +
      transcript +
      "\nUser: " + newText
    );
  }

  function friendlyErrorMessage(data, status) {
    const code = data && data.code;
    if (code === "RATE_LIMIT" || status === 429) {
      return "You're sending messages too fast — wait a moment and try again.";
    }
    if (code === "BAD_REQUEST") {
      return data.message || "That message couldn't be sent — please try again.";
    }
    if (data && data.message) {
      return data.message;
    }
    return "The AI service ran into a problem. Please try again in a moment.";
  }

  async function sendMessage() {
    const text = inputBox.value.trim();
    if (!text) return;

    addMessage(text, "user");
    inputBox.value = "";
    sendBtn.disabled = true;
    showTypingIndicator();

    const promptWithHistory = buildMessageWithHistory(text);

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: promptWithHistory }),
      });
      const data = await res.json();

      hideTypingIndicator();

      if (!res.ok || data.error) {
        addMessage(friendlyErrorMessage(data, res.status), "error");
      } else {
        addMessage(data.reply, "bot");
        history.push({ role: "user", text });
        history.push({ role: "assistant", text: data.reply });
      }
    } catch (err) {
      hideTypingIndicator();
      addMessage("Could not reach the server — check your connection and try again.", "error");
    }

    sendBtn.disabled = false;
    inputBox.focus();
  }

  sendBtn.addEventListener("click", sendMessage);
  inputBox.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
